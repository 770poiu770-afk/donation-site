services:
  - type: web
    name: donation-site
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    # Free plan has no persistent disk: the donations list resets on restart.
    # Before accepting real donations: switch to plan: starter and add
    #   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TIMEZONE
        value: Asia/Jerusalem
      - key: PAYPAL_MODE
        value: sandbox
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
